<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <title id="jsonPageTitle">BaoXiangGao Tools - JSON 工具箱</title>
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/layout.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/pages/json-toolbox.css" />
  </head>
  <body class="page-enter">
    <main class="fullscreen-wrap">
      <header class="page-header panel">
        <div class="panel-inner header-shell">
          <div class="brand">
            <span class="brand-kicker">Utility</span>
            <h1 class="brand-title" id="jsonBrandTitle" style="font-size: clamp(1.3rem, 2vw, 2rem)">JSON 工具箱</h1>
            <p class="brand-desc" id="jsonBrandDesc">格式化、校验、YAML 转换、路径提取和样本切换集中在一个面板里，适合更高频地处理结构化数据。</p>
          </div>
          <div class="header-actions-inline">
            <div class="switch-stack">
              <div class="switch-group" data-lang-switch role="group" aria-label="Language">
                <button class="switch-item" type="button" data-value="zh">中</button>
                <button class="switch-item" type="button" data-value="en">EN</button>
              </div>
              <div class="switch-group" data-theme-switch role="group" aria-label="Theme">
                <button class="switch-item theme-mode" type="button" data-value="dark">Dark</button>
                <button class="switch-item theme-mode" type="button" data-value="light">Light</button>
                <button class="switch-item theme-mode" type="button" data-value="system">System</button>
              </div>
            </div>
            <a class="btn" id="jsonBackHomeBtn" href="/index.html">返回首页</a>
          </div>
        </div>
      </header>

      <section class="json-shell fill-card">
        <article class="panel json-command-panel">
          <div class="panel-inner">
            <div class="panel-heading">
              <div>
                <h2 class="panel-title" id="jsonCommandTitle">操作面板</h2>
                <p class="muted" id="jsonCommandHint">先选样本，再决定是格式化、压缩、校验还是转换</p>
              </div>
              <div class="toolbar">
                <button class="btn" id="jsonSampleConfigBtn">配置样本</button>
                <button class="btn" id="jsonSampleApiBtn">接口样本</button>
                <button class="btn" id="jsonSampleTodoBtn">待办样本</button>
              </div>
            </div>
            <div class="json-toolbar-grid">
              <div class="toolbar">
                <button class="btn btn-primary" id="btnFormatJson">格式化</button>
                <button class="btn" id="btnMinifyJson">压缩</button>
                <button class="btn" id="btnValidateJson">校验</button>
                <button class="btn" id="btnJsonToYaml">JSON→YAML</button>
                <button class="btn" id="btnYamlToJson">YAML→JSON</button>
              </div>
              <div class="toolbar">
                <button class="btn" id="btnCopyOutput">复制输出</button>
                <button class="btn" id="btnSwapJson">交换输入输出</button>
                <button class="btn" id="btnClearJson">清空</button>
              </div>
            </div>
          </div>
        </article>

        <section class="json-work-grid">
          <article class="panel">
            <div class="panel-inner">
              <div class="panel-heading">
                <h2 class="panel-title" id="jsonInputTitle">输入</h2>
                <span class="pill" id="jsonInputModePill">JSON</span>
              </div>
              <textarea id="jsonInput" class="textarea json-textarea" spellcheck="false"></textarea>
            </div>
          </article>

          <article class="panel">
            <div class="panel-inner">
              <div class="panel-heading">
                <h2 class="panel-title" id="jsonOutputTitle">输出</h2>
                <span class="pill" id="jsonOutputModePill">Result</span>
              </div>
              <textarea id="jsonOutput" class="textarea json-textarea" spellcheck="false"></textarea>
            </div>
          </article>

          <aside class="panel json-side-panel">
            <div class="panel-inner">
              <h2 class="panel-title" id="jsonInsightTitle">结构洞察</h2>
              <div class="result-meta" id="jsonMeta"></div>
              <div class="json-summary-grid" id="jsonSummaryGrid"></div>
              <div class="field" style="margin-top: 16px">
                <span class="field-label" id="jsonPathLabel">路径提取</span>
                <input id="jsonPathInput" class="input" placeholder="例如：tools[0]" />
                <div class="toolbar">
                  <button class="btn" id="btnExtractPath">提取路径</button>
                  <button class="btn" id="btnCopyPathResult">复制路径结果</button>
                </div>
              </div>
              <div id="jsonPathResult" class="hash-output" style="margin-top: 12px">--</div>
              <div class="field" style="margin-top: 16px">
                <span class="field-label" id="jsonRecentLabel">最近样本</span>
                <div id="jsonRecentSamples" class="chips"></div>
              </div>
            </div>
          </aside>
        </section>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script type="module" src="/assets/js/pages/json-toolbox.js"></script>
  </body>
</html>
