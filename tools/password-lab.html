<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <title id="passwordLabPageTitle">BaoXiangGao Tools - 密码实验室</title>
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/layout.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/pages/password-lab.css" />
  </head>
  <body class="page-enter">
    <main class="fullscreen-wrap">
      <header class="page-header panel">
        <div class="panel-inner header-shell">
          <div class="brand">
            <span class="brand-kicker">Security Utility</span>
            <h1 class="brand-title" id="passwordLabBrandTitle" style="font-size: clamp(1.3rem, 2vw, 2rem)">密码实验室</h1>
            <p class="brand-desc" id="passwordLabBrandDesc">生成强密码、可读短语，以及常见文本摘要哈希，适合日常账号和开发场景。</p>
          </div>
          <div class="header-actions-inline">
            <div class="switch-stack">
              <div class="switch-group" data-lang-switch role="group" aria-label="Language">
                <button class="switch-item" type="button" data-value="zh">中</button>
                <button class="switch-item" type="button" data-value="en">EN</button>
              </div>
              <div class="switch-group" data-theme-switch role="group" aria-label="Theme">
                <button class="switch-item theme-mode" type="button" data-value="dark">Dark</button>
                <button class="switch-item theme-mode" type="button" data-value="light">Light</button>
                <button class="switch-item theme-mode" type="button" data-value="system">System</button>
              </div>
            </div>
            <a class="btn" id="passwordLabBackHomeBtn" href="/index.html">返回首页</a>
          </div>
        </div>
      </header>

      <section class="password-shell fill-card">
        <article class="panel password-generator-panel">
          <div class="panel-inner">
            <div class="panel-heading">
              <div>
                <h2 class="panel-title" id="passwordGeneratorTitle">密码生成器</h2>
                <p class="muted" id="passwordGeneratorHint">两种模式：随机密码和易读短语</p>
              </div>
              <span class="pill" id="passwordStrengthPill">Strong</span>
            </div>

            <div class="password-grid">
              <label class="field">
                <span class="field-label" id="passwordModeLabel">模式</span>
                <select id="passwordModeSelect" class="select">
                  <option value="password">随机密码</option>
                  <option value="passphrase">短语密码</option>
                </select>
              </label>
              <label class="field">
                <span class="field-label" id="passwordLengthLabel">长度</span>
                <input id="passwordLengthRange" type="range" min="8" max="48" value="18" />
              </label>
              <div class="field">
                <span class="field-label" id="passwordLengthValueLabel">当前长度</span>
                <div class="metric-box"><strong id="passwordLengthValue">18</strong></div>
              </div>
            </div>

            <div class="toggle-grid">
              <label class="check-row"><input id="useUppercase" type="checkbox" checked /> <span id="passwordUppercaseLabel">大写字母</span></label>
              <label class="check-row"><input id="useLowercase" type="checkbox" checked /> <span id="passwordLowercaseLabel">小写字母</span></label>
              <label class="check-row"><input id="useNumbers" type="checkbox" checked /> <span id="passwordNumbersLabel">数字</span></label>
              <label class="check-row"><input id="useSymbols" type="checkbox" checked /> <span id="passwordSymbolsLabel">符号</span></label>
            </div>

            <div class="password-output">
              <textarea id="passwordOutput" class="textarea compact-textarea" spellcheck="false" readonly></textarea>
            </div>

            <div class="toolbar">
              <button class="btn btn-primary" id="generatePasswordBtn">生成</button>
              <button class="btn" id="copyPasswordBtn">复制结果</button>
              <button class="btn" id="regeneratePasswordBtn">重新生成</button>
            </div>
          </div>
        </article>

        <article class="panel hash-panel">
          <div class="panel-inner">
            <h2 class="panel-title" id="hashToolTitle">文本摘要</h2>
            <p class="muted" id="hashToolHint">输入任意文本，快速得到 SHA-256 摘要</p>
            <textarea id="hashInput" class="textarea" spellcheck="false"></textarea>
            <div class="toolbar" style="margin-top: 10px">
              <button class="btn" id="generateHashBtn">生成哈希</button>
              <button class="btn" id="copyHashBtn">复制哈希</button>
            </div>
            <div class="hash-output" id="hashOutput">--</div>
          </div>
        </article>
      </section>
    </main>

    <script type="module" src="/assets/js/pages/password-lab.js"></script>
  </body>
</html>
