<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="unitConverterPageTitle">BaoXiangGao Tools - 单位换算</title>
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/layout.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/pages/unit-converter.css" />
  </head>
  <body class="page-enter">
    <main class="fullscreen-wrap">
      <header class="page-header panel">
        <div class="panel-inner header-shell">
          <div class="brand">
            <span class="brand-kicker">Conversion Utility</span>
            <h1 class="brand-title" id="unitConverterBrandTitle" style="font-size: clamp(1.3rem, 2vw, 2rem)">单位换算台</h1>
            <p class="brand-desc" id="unitConverterBrandDesc">集中处理长度、重量、温度、数据体积和时间换算，适合开发和日常使用。</p>
          </div>
          <div class="header-actions-inline">
            <div class="switch-stack">
              <div class="switch-group" data-lang-switch role="group" aria-label="Language">
                <button class="switch-item" type="button" data-value="zh">中</button>
                <button class="switch-item" type="button" data-value="en">EN</button>
              </div>
              <div class="switch-group" data-theme-switch role="group" aria-label="Theme">
                <button class="switch-item theme-mode" type="button" data-value="dark">Dark</button>
                <button class="switch-item theme-mode" type="button" data-value="light">Light</button>
                <button class="switch-item theme-mode" type="button" data-value="system">System</button>
              </div>
            </div>
            <a class="btn" id="unitConverterBackHomeBtn" href="/index.html">返回首页</a>
          </div>
        </div>
      </header>

      <section class="converter-shell fill-card">
        <article class="panel">
          <div class="panel-inner">
            <div class="converter-controls">
              <label class="field">
                <span class="field-label" id="converterCategoryLabel">类别</span>
                <select id="converterCategorySelect" class="select"></select>
              </label>
              <label class="field">
                <span class="field-label" id="converterFromLabel">从</span>
                <select id="converterFromSelect" class="select"></select>
              </label>
              <label class="field">
                <span class="field-label" id="converterToLabel">到</span>
                <select id="converterToSelect" class="select"></select>
              </label>
              <label class="field">
                <span class="field-label" id="converterValueLabel">数值</span>
                <input id="converterValueInput" class="input" type="number" step="any" value="1" />
              </label>
            </div>
            <div class="toolbar">
              <button class="btn btn-primary" id="convertNowBtn">立即换算</button>
              <button class="btn" id="swapUnitsBtn">交换方向</button>
              <button class="btn" id="copyResultBtn">复制结果</button>
            </div>
          </div>
        </article>

        <section class="grid-two converter-panels">
          <article class="panel">
            <div class="panel-inner">
              <h2 class="panel-title" id="converterResultTitle">结果</h2>
              <div id="converterResult" class="converter-result">1</div>
              <div class="muted" id="converterFormula">--</div>
            </div>
          </article>

          <article class="panel">
            <div class="panel-inner">
              <h2 class="panel-title" id="converterQuickListTitle">常用换算</h2>
              <div id="converterQuickList" class="converter-quick-list"></div>
            </div>
          </article>
        </section>
      </section>
    </main>

    <script type="module" src="/assets/js/pages/unit-converter.js"></script>
  </body>
</html>
